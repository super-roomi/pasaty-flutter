name: mockup
description: "A new Flutter project."


version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  url_launcher: ^6.3.0
  intl_phone_field: ^3.2.0

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  socket_io_client: ^3.1.6
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/qi-card-seeklogo.png
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/NotoSansArabic-Regular.ttf
        - asset: assets/NotoSansArabic-Regular.ttf
          weight: 700
        - asset: assets/NotoSansArabic-Regular.ttf
          style: italic