org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# R8's newer resource shrinker. `isShrinkResources` was already on; this opts
# into the optimized implementation, which Play flags as missing because the
# legacy one leaves unreachable resources in the APK. Available from AGP 8.7.
android.r8.optimizedResourceShrinking=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# Kept at false, and not worth fighting: the Flutter migrator rewrites this
# line back on every build. AGP 9 defaults it to true, which would resolve
# `android { }` to ApplicationExtension instead of the deprecated
# BaseAppModuleExtension — but the build is green either way once the
# kotlinOptions DSL in app/build.gradle.kts was migrated, which was the actual
# AGP 9 blocker.
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
